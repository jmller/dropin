name: Safety behavior report
description: Report a non-confidential retention, verification, collision, or locking concern
title: "[Safety]: "
labels: [safety]
body:
  - type: markdown
    attributes:
      value: |
        Stop retries and destructive cleanup. Preserve the source, state, remote, destination, and any stage/aside. This issue is public. Report vulnerabilities, secrets, and private-metadata exposure privately using SECURITY.md; consult SUPPORT.md for safe diagnostics.
  - type: dropdown
    id: operation
    attributes:
      label: Affected operation
      options: [Drain or eviction, Recovery, Restore, Collision or force-aside, Verification, Locking]
    validations:
      required: true
  - type: checkboxes
    id: retained
    attributes:
      label: Artifacts still retained
      options:
        - label: Original source
        - label: Local state/catalog
        - label: Remote repository
        - label: Restore output
        - label: Private stage or aside
  - type: input
    id: version
    attributes:
      label: Dropin version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: macOS version, build, architecture, and Python/restic/rclone versions
    validations:
      required: true
  - type: textarea
    id: invariant
    attributes:
      label: Safety behavior observed
      description: Explain what was retained, removed, overwritten, unverified, or reported.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal disposable reproduction
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted output and exit code
      description: Never include passwords, tokens, rclone config, repository URLs, private metadata, or archive contents.
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-report confirmation
      options:
        - label: This is not a confidential security report and all credentials and private data have been removed.
          required: true
